<!DOCTYPE html>      
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Séries</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">     
</head>
<body>
  <header role="banner" class=" text-6xl text-center font-mono text-yellow-500 py-10">
    <h1>Catálogo de Séries</h1>
  </header>

  <main class=" py-36 text-center text-white space-y-10">
    <!-- Região de busca -->
    <section aria-labelledby="search-heading">
      <h2 id="search-heading" class="sr-only ">Pesquisa de séries</h2>
      <form id="search-form" role="search" class=" space-y-14 ">
        <label for="search-input" class=" text-2xl">Nome da série</label>
        <input  class=" text-black border"type="search" id="search-input" name="q"
               placeholder="Ex: Breaking Bad"
               required aria-describedby="search-hint" class=" text-2xl border pl-8">
        <p id="search-hint" class="mx-auto">Digite o nome e pressione Enter ou clique em Buscar.</p>
        <button type="submit" class=" border  p-2 rounded-3xl cursor-pointer">Buscar</button>
      </form>
    </section>

    <!-- Região de filtros -->
    <section id="filters-section" aria-labelledby="filters-heading" hidden >
      <h2 id="filters-heading" class="text-4xl font-mono text-yellow-500 mb-4">Filtros</h2>
      <div class="bg-gray-800 p-6 rounded-lg shadow-md text-black">
        <label for="genre-filter" class="text-white">Gênero</label>
        <select id="genre-filter"><option value="">Todos</option></select>
        <label for="status-filter" class="text-white">Status</label>
        <select id="status-filter">
          <option value="">Todos</option>
          <option value="Running">Em exibição</option>
          <option value="Ended">Finalizada</option>
          <option value="To Be Determined">A definir</option>
          <option value="In Development">Em desenvolvimento</option>
        </select>
      </div>
    </section>

    <!-- Feedback de estado -->
    <div id="status-message" role="status" aria-live="polite"></div>

    <!-- Lista de resultados -->
    <section id="results-section" aria-labelledby="results-heading" hidden>
      <h2 id="results-heading" class="text-4xl font-mono text-yellow-500 mb-4">Resultados</h2>
      <ul id="results-list" role="list"></ul>
    </section> 

    <!-- Detalhes da série -->
    <section id="details-section" aria-labelledby="details-heading" hidden>
      <h2 id="details-heading" class="text-4xl font-mono text-yellow-500 mb-4">Detalhes da Série</h2>
      <article id="details-content"></article>
    </section>
  </main>

  <footer role="contentinfo" class=" flex justify-center text-white ">
    <p>Dados fornecidos pela <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener">TVmaze API</a>.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
